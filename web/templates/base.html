<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}UserAlerts{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem 1.25rem 3rem;
    line-height: 1.45;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid #8883;
    margin-bottom: 1.5rem;
  }
  header .brand { font-weight: 600; text-decoration: none; }
  .muted { opacity: 0.65; font-size: 0.9em; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }
  .card {
    border: 1px solid #8883;
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 1.25rem;
  }
  label { display: block; margin-bottom: 0.85rem; font-size: 0.92rem; }
  input[type=text], input[type=number], textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-top: 0.3rem;
    padding: 0.45rem 0.55rem;
    border-radius: 6px;
    border: 1px solid #8886;
    font: inherit;
    background: transparent;
    color: inherit;
  }
  textarea { resize: vertical; }
  fieldset { border: 1px solid #8886; border-radius: 6px; margin-bottom: 0.85rem; }
  legend { font-size: 0.85rem; opacity: 0.75; padding: 0 0.35rem; }
  label.checkbox { display: inline-block; margin-right: 1rem; font-size: 0.92rem; }
  button, .btn, .btn-secondary {
    display: inline-block;
    font: inherit;
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    border: 1px solid #8886;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }
  button, .btn { background: #4c8bf522; border-color: #4c8bf588; }
  .btn-secondary { background: transparent; margin-left: 0.4rem; }
  .link-btn {
    background: none; border: none; padding: 0; font: inherit;
    text-decoration: underline; color: #c0392b; cursor: pointer;
  }
  .inline-form { display: inline; }
  table.alerts-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.alerts-table th, table.alerts-table td {
    text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #8883;
    vertical-align: top;
  }
  code { font-size: 0.85em; }
  details.help {
    border: 1px solid #8886;
    border-radius: 8px;
    padding: 0.5rem 0.8rem;
    margin-bottom: 1rem;
    font-size: 0.88rem;
  }
  details.help summary { cursor: pointer; font-weight: 600; }
  details.help summary:hover { opacity: 0.8; }
  details.help .help-body { margin-top: 0.6rem; }
  details.help h3 { font-size: 0.92rem; margin: 0.9rem 0 0.3rem; }
  details.help h3:first-child { margin-top: 0.2rem; }
  details.help ul { padding-left: 1.1rem; margin: 0.3rem 0; }
  details.help li { margin-bottom: 0.5rem; }
  details.help code { word-break: break-word; }
  .field-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin: 0.4rem 0 0.2rem;
    max-height: 9rem;
    overflow-y: auto;
    padding: 0.4rem;
    border: 1px solid #8884;
    border-radius: 6px;
  }
  .field-chips code {
    background: #4c8bf51a;
    border: 1px solid #4c8bf544;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }
  .field-chips .unit { opacity: 0.6; font-size: 0.85em; }
  .qr { max-width: 220px; display: block; margin: 0.5rem 0; }
  ul.flashes { list-style: none; padding: 0; margin: 0 0 1.25rem; }
  .flash { padding: 0.55rem 0.8rem; border-radius: 6px; margin-bottom: 0.5rem; font-size: 0.92rem; }
  .flash-error { background: #c0392b22; border: 1px solid #c0392b55; }
  .flash-success { background: #27ae6022; border: 1px solid #27ae6055; }
  ul.user-list { padding-left: 1.1rem; }
  form.name-form { display: flex; gap: 0.5rem; margin: 1rem 0; }
  form.name-form input { margin: 0; }
</style>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}">UserAlerts</a>
  {% if display_name %}<span class="muted">/ {{ display_name }}</span>{% endif %}
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <ul class="flashes">
      {% for category, message in messages %}
      <li class="flash flash-{{ category }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
