<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}UserAlerts{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem 1.25rem 3rem;
    line-height: 1.45;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid #8883;
    margin-bottom: 1.5rem;
  }
  header .brand { font-weight: 600; text-decoration: none; }
  .muted { opacity: 0.65; font-size: 0.9em; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }
  .card {
    border: 1px solid #8883;
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 1.25rem;
  }
  label { display: block; margin-bottom: 0.85rem; font-size: 0.92rem; }
  input[type=text], input[type=number], textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-top: 0.3rem;
    padding: 0.45rem 0.55rem;
    border-radius: 6px;
    border: 1px solid #8886;
    font: inherit;
    background: transparent;
    color: inherit;
  }
  textarea { resize: vertical; }
  /* The code boxes: a textarea with a line-number gutter and a highlighted
     copy of its own text painted underneath it. The <pre>, the <textarea>
     and the gutter must agree on every metric that affects layout -- font,
     size, line height, padding, wrapping -- or the highlighting drifts out
     from under the caret, so those are set once, together. */
  .code-editor .code-gutter,
  .code-editor .code-highlight,
  .code-editor textarea.code-input {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    tab-size: 4;
    white-space: pre;
    word-wrap: normal;
    padding: 0.45rem 0.55rem;
    margin: 0;
    border: 0;
  }
  .code-editor {
    display: flex;
    align-items: stretch;
    margin-top: 0.3rem;
    border: 1px solid #8886;
    border-radius: 6px;
    overflow: hidden;
  }
  .code-editor:focus-within { border-color: #4c8bf5aa; }
  .code-gutter {
    flex: 0 0 auto;
    overflow: hidden;
    text-align: right;
    user-select: none;
    background: #8881;
    opacity: 0.55;
  }
  .code-gutter div.err { color: #c0392b; opacity: 1; font-weight: 600; }
  .code-stack { position: relative; flex: 1 1 auto; min-width: 0; }
  .code-editor .code-highlight,
  .code-editor textarea.code-input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    border-radius: 0;
    background: transparent;
    overflow: auto;
  }
  .code-editor .code-highlight {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    color: inherit;
  }
  .code-editor textarea.code-input {
    position: relative;
    /* Transparent text over the highlighted copy -- the caret, selection
       and undo history all still belong to the textarea, which is what
       keeps normal editing (and mobile keyboards) working. */
    color: transparent;
    caret-color: currentColor;
    resize: none;
  }
  .code-editor textarea.code-input::selection { background: #4c8bf555; }
  /* The textarea's own text is transparent (the highlighted copy shows
     through), so the placeholder needs a real colour of its own or it
     would be invisible too. */
  .code-editor textarea.code-input::placeholder { color: #8888; opacity: 1; }
  .tok-str, .tok-num { color: #b06a1e; }
  .tok-kw { color: #a052c0; }
  .tok-fn { color: #2f7bd6; }
  .tok-builtin { color: #2f9e7e; }
  .tok-op { opacity: 0.7; }
  .tok-brace { color: #a052c0; font-weight: 600; }
  .tok-err { color: #c0392b; text-decoration: underline wavy #c0392b; }
  @media (prefers-color-scheme: dark) {
    .tok-str, .tok-num { color: #e0a060; }
    .tok-kw { color: #c792ea; }
    .tok-fn { color: #82aaff; }
    .tok-builtin { color: #6fd6b0; }
  }
  pre.code-frame {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    overflow-x: auto;
    background: #8881;
    border-radius: 6px;
    padding: 0.5rem 0.65rem;
    margin: 0.2rem 0;
  }
  fieldset { border: 1px solid #8886; border-radius: 6px; margin-bottom: 0.85rem; }
  legend { font-size: 0.85rem; opacity: 0.75; padding: 0 0.35rem; }
  label.checkbox { display: inline-block; margin-right: 1rem; font-size: 0.92rem; }
  button, .btn, .btn-secondary {
    display: inline-block;
    font: inherit;
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    border: 1px solid #8886;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }
  button, .btn { background: #4c8bf522; border-color: #4c8bf588; }
  .btn-secondary { background: transparent; margin-left: 0.4rem; }
  .link-btn {
    background: none; border: none; padding: 0; font: inherit;
    text-decoration: underline; color: #c0392b; cursor: pointer;
  }
  .inline-form { display: inline; }
  table.alerts-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.alerts-table th, table.alerts-table td {
    text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #8883;
    vertical-align: top;
  }
  code { font-size: 0.85em; }
  details.help {
    border: 1px solid #8886;
    border-radius: 8px;
    padding: 0.5rem 0.8rem;
    margin-bottom: 1rem;
    font-size: 0.88rem;
  }
  details.help summary { cursor: pointer; font-weight: 600; }
  details.help summary:hover { opacity: 0.8; }
  details.help .help-body { margin-top: 0.6rem; }
  details.help h3 { font-size: 0.92rem; margin: 0.9rem 0 0.3rem; }
  details.help h3:first-child { margin-top: 0.2rem; }
  details.help ul { padding-left: 1.1rem; margin: 0.3rem 0; }
  details.help li { margin-bottom: 0.5rem; }
  details.help code { word-break: break-word; }
  .field-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin: 0.4rem 0 0.2rem;
    max-height: 9rem;
    overflow-y: auto;
    padding: 0.4rem;
    border: 1px solid #8884;
    border-radius: 6px;
  }
  .field-chips code {
    background: #4c8bf51a;
    border: 1px solid #4c8bf544;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }
  .field-chips .unit { opacity: 0.6; font-size: 0.85em; }
  #test-result, #debug-result {
    border: 1px solid #8886;
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    margin-top: 0.75rem;
    font-size: 0.92rem;
  }
  #test-result h3, #debug-result h3 { font-size: 0.92rem; margin: 0.8rem 0 0.3rem; }
  #test-result p, #debug-result p { margin: 0.35rem 0; }
  #debug-result summary { cursor: pointer; font-size: 0.9em; opacity: 0.75; }
  .test-ok { color: #27ae60; }
  .test-idle { opacity: 0.75; }
  .test-error { color: #c0392b; }
  pre.test-message {
    white-space: pre-wrap;
    word-break: break-word;
    background: #8881;
    border-radius: 6px;
    padding: 0.5rem 0.65rem;
    margin: 0.2rem 0;
  }
  .image-opts { display: flex; gap: 0.8rem; }
  .image-opts label { flex: 1 1 0; }
  img.snapshot-preview {
    display: block;
    max-width: 100%;
    border-radius: 6px;
    margin: 0.35rem 0;
  }
  .qr { max-width: 220px; display: block; margin: 0.5rem 0; }
  ul.flashes { list-style: none; padding: 0; margin: 0 0 1.25rem; }
  .flash { padding: 0.55rem 0.8rem; border-radius: 6px; margin-bottom: 0.5rem; font-size: 0.92rem; }
  .flash-error { background: #c0392b22; border: 1px solid #c0392b55; }
  .flash-success { background: #27ae6022; border: 1px solid #27ae6055; }
  ul.user-list { padding-left: 1.1rem; }
  form.name-form { display: flex; gap: 0.5rem; margin: 1rem 0; }
  form.name-form input { margin: 0; }
</style>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}">UserAlerts</a>
  {% if display_name %}<span class="muted">/ {{ display_name }}</span>{% endif %}
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <ul class="flashes">
      {% for category, message in messages %}
      <li class="flash flash-{{ category }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
