# nginx config for exposing the UserAlerts config web panel at
# https://<your-server>/alerts/ , protected by HTTP basic auth.
#
# This app has NO login of its own (see web/README.md) -- it's designed to
# sit behind exactly this kind of proxy once it's reachable beyond your LAN.
# Pair with useralerts-web.service (next to this file), which binds the app
# to 127.0.0.1:8081 so nginx is the only way in.
#
# Install:
#   1. Create the password file (pick any username):
#        sudo apt-get install apache2-utils   # provides htpasswd; on RHEL/Fedora: httpd-tools
#        sudo htpasswd -c /etc/nginx/.htpasswd_alerts youruser
#      (drop -c on later runs / additional users -- it truncates the file)
#   2. Paste the "location" block below into the `server {}` block of your
#      existing site (the one already serving WeeWX's public_html, e.g.
#      /etc/nginx/sites-enabled/<your-site> or conf.d/<your-site>.conf) --
#      it must be a server{} that already has ssl/listen 443 configured if
#      you want this over HTTPS, which you should for basic auth.
#   3. sudo nginx -t && sudo systemctl reload nginx

# Bare "/alerts" (no trailing slash) -> redirect to "/alerts/" so relative
# links/url_for() inside the app resolve correctly.
location = /alerts {
    return 301 /alerts/;
}

location /alerts/ {
    auth_basic           "UserAlerts";
    auth_basic_user_file  /etc/nginx/.htpasswd_alerts;

    # Trailing slash on both this and proxy_pass strips the "/alerts" prefix
    # before it reaches Flask; X-Forwarded-Prefix tells the app (via
    # ProxyFix, see useralerts_web.py) to put it back when building URLs
    # with url_for(), so generated links/redirects/forms stay under /alerts/.
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /alerts;
}
